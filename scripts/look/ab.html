<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind A/B</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 15px system-ui, sans-serif; }
  main { max-width: 1600px; margin: 0 auto; padding: 12px 16px; }
  #pair { display: flex; gap: 12px; justify-content: center; }
  #pair figure { margin: 0; flex: 1 1 0; min-width: 0; text-align: center; }
  #pair video { width: 100%; max-height: 72vh; object-fit: contain; background: #000; }
  #bar { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
  #seek { flex: 1; }
  #choice { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  #note { flex: 1; min-width: 200px; height: 3em; background: #222; color: #ddd; border: 1px solid #444; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #555; padding: 8px 16px; font: inherit; cursor: pointer; }
  button.picked { background: #3d5a80; border-color: #8ab; }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { color: #9a9; min-height: 1.4em; }
  pre { background: #1b1b1b; padding: 8px; overflow: auto; max-height: 40vh; }
</style>
</head>
<body>
<main>
  <p id="head"></p>
  <div id="pair">
    <figure><video id="left" muted playsinline preload="auto"></video><figcaption>Left</figcaption></figure>
    <figure><video id="right" muted playsinline preload="auto"></video><figcaption>Right</figcaption></figure>
  </div>
  <audio id="audio" preload="auto"></audio>
  <div id="bar">
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1" step="0.01" value="0">
    <span id="time">0:00</span>
  </div>
  <div id="choice">
    <button data-c="left">Left is better</button>
    <button data-c="same">Same</button>
    <button data-c="right">Right is better</button>
    <textarea id="note" placeholder="Note (optional)"></textarea>
    <button id="submit" disabled>Next</button>
  </div>
  <p id="status"></p>
  <p><button id="download">Download log</button></p>
  <pre id="done" hidden></pre>
</main>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const A = q.get("a"), B = q.get("b");
const AUDIO = q.get("audio") || A;
const TRIALS = Math.max(1, parseInt(q.get("trials") || "3", 10) || 3);
const LOG = (q.get("log") || "ab-log").replace(/[^A-Za-z0-9._-]/g, "_").slice(0, 75) + ".json";
const KEY = "ab:" + location.search;
const $ = (id) => document.getElementById(id);
const L = $("left"), R = $("right"), AU = $("audio");

function load() {
  const saved = localStorage.getItem(KEY);
  return saved ? JSON.parse(saved) : null;
}
let log = load() || { a: A, b: B, audio: AUDIO, trials: TRIALS, started: new Date().toISOString(), verdicts: [] };
let swapped = false, choice = null;

function fmt(s) { const m = Math.floor(s / 60); return m + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(log)); } catch { /* private window: the server copy still saves */ }
  return fetch("/log/" + LOG, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(log, null, 1) })
    .then((r) => { $("status").textContent = r.ok ? "Saved " + log.verdicts.length + " verdict(s) to " + LOG : "Server did not save the log (" + r.status + "); use Download."; })
    .catch(() => { $("status").textContent = "No server to save to; use Download."; });
}

function startTrial() {
  const n = log.verdicts.length;
  if (n >= TRIALS) return finish();
  swapped = crypto.getRandomValues(new Uint8Array(1))[0] < 128;
  AU.pause();
  L.src = swapped ? B : A;
  R.src = swapped ? A : B;
  AU.src = AUDIO;
  AU.currentTime = 0;
  choice = null;
  $("note").value = "";
  document.querySelectorAll("[data-c]").forEach((b) => b.classList.remove("picked"));
  $("submit").disabled = true;
  $("play").textContent = "Play";
  $("head").textContent = "Trial " + (n + 1) + " of " + TRIALS + ". Watch both, then pick one.";
}

function finish() {
  AU.pause(); L.pause(); R.pause();
  $("head").textContent = "Done. " + log.verdicts.length + " verdicts.";
  $("pair").hidden = $("bar").hidden = $("choice").hidden = true;
  $("done").hidden = false;
  $("done").textContent = JSON.stringify(log, null, 1);
}

// The audio element is the clock; the videos chase it.
function sync() {
  const t = AU.currentTime;
  for (const v of [L, R]) {
    if (Math.abs(v.currentTime - t) > 0.08) v.currentTime = t;
    if (AU.paused !== v.paused) AU.paused ? v.pause() : v.play().catch(() => {});
  }
  if (AU.duration) { $("seek").max = AU.duration; $("seek").value = t; }
  $("time").textContent = fmt(t) + (AU.duration ? " / " + fmt(AU.duration) : "");
  requestAnimationFrame(sync);
}

$("play").onclick = () => {
  if (AU.paused) { AU.play().catch((e) => { $("status").textContent = "Could not play: " + e.message; }); $("play").textContent = "Pause"; }
  else { AU.pause(); $("play").textContent = "Play"; }
};
$("seek").oninput = (e) => { AU.currentTime = Number(e.target.value); L.currentTime = R.currentTime = AU.currentTime; };
AU.onended = () => { $("play").textContent = "Play"; };
document.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => {
  choice = b.dataset.c;
  document.querySelectorAll("[data-c]").forEach((x) => x.classList.toggle("picked", x === b));
  $("submit").disabled = false;
});
$("submit").onclick = () => {
  if (!choice) return;
  const left = swapped ? B : A, right = swapped ? A : B;
  log.verdicts.push({
    trial: log.verdicts.length + 1,
    left, right, choice,
    preferred: choice === "same" ? "same" : (choice === "left" ? left : right),
    note: $("note").value.trim(),
    timestamp: new Date().toISOString(),
  });
  save();
  startTrial();
};
$("download").onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(log, null, 1)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = LOG; a.click();
  URL.revokeObjectURL(url);
};

if (!A || !B) {
  $("head").textContent = "Give two clips: ab.html?a=one.mp4&b=two.mp4[&audio=track.wav][&trials=3][&log=name]";
  $("pair").hidden = $("bar").hidden = $("choice").hidden = true;
} else {
  startTrial();
  requestAnimationFrame(sync);
}
</script>
</body>
</html>
