name: Rust
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.93.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude hyst-render
  test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config mesa-vulkan-drivers vulkan-tools
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      # Render tests return early when wgpu finds no adapter; make that fail.
      - name: Check lavapipe is visible to Vulkan
        shell: bash
        run: |
          vulkaninfo --summary | tee vulkaninfo.txt
          grep -qi llvmpipe vulkaninfo.txt
      - name: cargo test -p hyst-render
        shell: bash
        run: |
          cargo test -p hyst-render -- --nocapture 2>&1 | tee render-test.log
          if grep -q "no GPU adapter" render-test.log; then
            echo "::error::wgpu found no GPU adapter; render tests were skipped"
            exit 1
          fi
